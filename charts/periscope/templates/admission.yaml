{{- $name := include "periscope.name" . -}}
{{- $secretName := printf "%s-tls" $name -}}
{{- $ca := .Values.admission.caBundle -}}
{{- if .Values.admission.existingSecret -}}
{{- if not $ca -}}{{ fail "admission.caBundle required with existingSecret" }}{{- end -}}
{{- else -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $existing -}}
{{- $ca = index $existing.data "ca.crt" -}}
{{- else -}}
{{- $authority := genCA (printf "%s-ca" $name) 3650 -}}
{{- $dns := printf "%s-admission.%s.svc" $name .Release.Namespace -}}
{{- $cert := genSignedCert $dns nil (list $dns (printf "%s.cluster.local" $dns)) 365 $authority -}}
{{- $ca = $authority.Cert | b64enc -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
  ca.crt: {{ $ca }}
---
{{- end -}}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-admission
  labels:
    app.kubernetes.io/part-of: periscope
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}-admission
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ $name }}
webhooks:
  - name: validate.periscope.kentrasecurity.io
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    matchPolicy: Equivalent
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: {{ .Values.policy.namespaces | toJson }}
    # Contract deletions are always allowed by the validator, so they bypass the
    # webhook: deleting a namespace (or a stale release whose admission Service
    # is gone) must never deadlock on an unreachable webhook.
    matchConditions:
      - name: contracts-or-operator-identity
        expression: {{ printf "(request.resource.group == 'periscope.kentrasecurity.io' && request.operation != 'DELETE') || request.userInfo.username in ['system:serviceaccount:%s:%s-investigator', 'system:serviceaccount:%s:%s-executor']" .Release.Namespace $name .Release.Namespace $name | quote }}
    clientConfig:
      caBundle: {{ $ca }}
      service:
        namespace: {{ .Release.Namespace }}
        name: {{ $name }}-admission
        path: /
        port: 443
    rules:
      - operations: [CREATE, UPDATE, DELETE]
        apiGroups: ['*']
        apiVersions: ['*']
        resources: ['*/*']
        scope: Namespaced
