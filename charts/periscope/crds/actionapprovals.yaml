{
  "apiVersion": "apiextensions.k8s.io/v1",
  "kind": "CustomResourceDefinition",
  "metadata": {
    "name": "actionapprovals.periscope.kentrasecurity.io"
  },
  "spec": {
    "group": "periscope.kentrasecurity.io",
    "scope": "Namespaced",
    "names": {
      "kind": "ActionApproval",
      "plural": "actionapprovals",
      "singular": "actionapproval"
    },
    "versions": [
      {
        "name": "v1alpha1",
        "served": true,
        "storage": true,
        "subresources": {
          "status": {}
        },
        "additionalPrinterColumns": [
          {
            "name": "Decision",
            "type": "string",
            "jsonPath": ".spec.decision"
          },
          {
            "name": "Plan",
            "type": "string",
            "jsonPath": ".spec.planName"
          },
          {
            "name": "Age",
            "type": "date",
            "jsonPath": ".metadata.creationTimestamp"
          }
        ],
        "schema": {
          "openAPIV3Schema": {
            "type": "object",
            "properties": {
              "apiVersion": {
                "type": "string",
                "maxLength": 1024
              },
              "kind": {
                "type": "string",
                "maxLength": 1024
              },
              "metadata": {
                "type": "object"
              },
              "spec": {
                "type": "object",
                "properties": {
                  "planName": {
                    "type": "string",
                    "maxLength": 253
                  },
                  "decision": {
                    "type": "string",
                    "maxLength": 16,
                    "enum": [
                      "Pending",
                      "Approve",
                      "Reject"
                    ]
                  },
                  "taskUID": {
                    "type": "string",
                    "maxLength": 128
                  },
                  "planUID": {
                    "type": "string",
                    "maxLength": 128
                  },
                  "planDigest": {
                    "type": "string",
                    "maxLength": 128,
                    "pattern": "^sha256:[a-f0-9]{64}$"
                  },
                  "expiresAt": {
                    "type": "string",
                    "maxLength": 64,
                    "format": "date-time"
                  }
                },
                "required": [
                  "taskUID",
                  "planUID",
                  "planDigest",
                  "expiresAt"
                ],
                "x-kubernetes-validations": [
                  {
                    "rule": "self.taskUID == oldSelf.taskUID && self.planUID == oldSelf.planUID && self.planDigest == oldSelf.planDigest && self.expiresAt == oldSelf.expiresAt",
                    "message": "approval bindings and expiry are immutable"
                  },
                  {
                    "rule": "(!has(oldSelf.decision) && !has(self.decision)) || (has(oldSelf.decision) && has(self.decision) && (self.decision == oldSelf.decision || (oldSelf.decision == 'Pending' && self.decision in ['Approve','Reject'])))",
                    "message": "decision allows only Pending to Approve or Reject"
                  }
                ]
              },
              "status": {
                "type": "object",
                "properties": {
                  "conditions": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "type": {
                          "type": "string",
                          "maxLength": 128
                        },
                        "status": {
                          "type": "string",
                          "maxLength": 8,
                          "enum": [
                            "True",
                            "False",
                            "Unknown"
                          ]
                        },
                        "reason": {
                          "type": "string",
                          "maxLength": 128
                        },
                        "message": {
                          "type": "string",
                          "maxLength": 4096
                        },
                        "observedGeneration": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 9007199254740992
                        },
                        "lastTransitionTime": {
                          "type": "string",
                          "maxLength": 64,
                          "format": "date-time"
                        }
                      },
                      "required": [
                        "type",
                        "status",
                        "reason",
                        "message",
                        "lastTransitionTime"
                      ]
                    },
                    "maxItems": 32
                  }
                },
                "required": []
              }
            },
            "required": [
              "spec"
            ]
          }
        }
      }
    ]
  }
}
