name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Test and vet
        run: make test

      - name: Vet live tests
        run: go vet -tags live ./tests/live

      - name: Check generated CRDs
        run: |
          python3 hack/generate-crds.py
          git diff --exit-code charts/periscope/crds

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint charts/periscope -f tests/e2e/suite/values-openai.yaml
