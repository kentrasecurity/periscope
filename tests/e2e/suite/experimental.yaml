# Experimental application-error scenario (SUITE_EXPERIMENTAL=1, with
# values-experimental.yaml). suite-client is Running and Ready, but every
# request to suite-backend times out: the backend's NetworkPolicy admits only
# suite-web. Only the client's logs show the failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suite-backend
  namespace: agent-operator-test
  labels: {app.kubernetes.io/name: suite-backend, app.kubernetes.io/part-of: suite}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: suite-backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: suite-backend}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: suite-backend
  namespace: agent-operator-test
spec:
  selector: {app.kubernetes.io/name: suite-backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: suite-backend-ingress
  namespace: agent-operator-test
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: suite-backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: suite-web}
      ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: suite-client
  namespace: agent-operator-test
  labels: {app.kubernetes.io/name: suite-client, app.kubernetes.io/part-of: suite}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: suite-client}
  template:
    metadata:
      labels: {app.kubernetes.io/name: suite-client}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: client
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              while :; do
                if out=$(wget -q -T 2 -O /dev/null http://suite-backend 2>&1); then
                  echo "GET http://suite-backend ok"
                else
                  echo "ERROR: GET http://suite-backend failed: $out"
                fi
                sleep 3
              done
          resources: {requests: {cpu: 10m, memory: 8Mi}, limits: {memory: 32Mi}}
