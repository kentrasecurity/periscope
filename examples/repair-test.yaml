# Broken workloads for autorepair testing.
# Apply:   kubectl apply -f broken-k8s-testcases.yaml
# Cleanup: kubectl delete ns agent-operator-test
# Each workload carries labels/annotations with the expected failure and the expected fix.
---
apiVersion: v1
kind: Namespace
metadata:
  name: agent-operator-test
  labels:
    purpose: agent-operator-test
---
# TC01 - ImagePullBackOff / ErrImagePull: image tag does not exist
# Fix: correct tag (nginx:1.27)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc01-imagepull
  namespace: agent-operator-test
  labels: {testcase: tc01, expected-error: ImagePullBackOff}
  annotations:
    autorepair.test/expected-fix: "set image to a valid tag, e.g. nginx:1.27"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc01}}
  template:
    metadata: {labels: {app: tc01, testcase: tc01}}
    spec:
      containers:
        - name: web
          image: nginx:9.99.99-doesnotexist
          ports: [{containerPort: 80}]
---
# TC02 - InvalidImageName: malformed image reference
# Fix: valid image reference
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc02-invalid-image
  namespace: agent-operator-test
  labels: {testcase: tc02, expected-error: InvalidImageName}
  annotations:
    autorepair.test/expected-fix: "set image to a valid reference, e.g. busybox:1.36"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc02}}
  template:
    metadata: {labels: {app: tc02, testcase: tc02}}
    spec:
      containers:
        - name: app
          image: "BusyBox:::Latest"
          command: ["sleep", "3600"]
---
# TC03 - CrashLoopBackOff: process exits non-zero immediately
# Fix: correct the command (e.g. sleep infinity)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc03-crashloop
  namespace: agent-operator-test
  labels: {testcase: tc03, expected-error: CrashLoopBackOff}
  annotations:
    autorepair.test/expected-fix: "replace failing command with a long-running one"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc03}}
  template:
    metadata: {labels: {app: tc03, testcase: tc03}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo 'fatal: missing DB_URL' >&2; exit 1"]
---
# TC04 - OOMKilled: memory limit too low for workload (tail /dev/zero grows unbounded)
# Fix: raise memory limit / fix workload
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc04-oomkilled
  namespace: agent-operator-test
  labels: {testcase: tc04, expected-error: OOMKilled}
  annotations:
    autorepair.test/expected-fix: "increase resources.limits.memory or fix the leaking command"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc04}}
  template:
    metadata: {labels: {app: tc04, testcase: tc04}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "tail /dev/zero"]
          resources:
            requests: {memory: "16Mi", cpu: "10m"}
            limits: {memory: "32Mi", cpu: "100m"}
---
# TC05 - Pending (Insufficient cpu/memory): requests exceed any node capacity
# Fix: lower requests
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc05-insufficient-resources
  namespace: agent-operator-test
  labels: {testcase: tc05, expected-error: "Pending-Insufficient"}
  annotations:
    autorepair.test/expected-fix: "reduce resources.requests to fit node allocatable"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc05}}
  template:
    metadata: {labels: {app: tc05, testcase: tc05}}
    spec:
      containers:
        - name: app
          image: nginx:1.27
          resources:
            requests: {cpu: "500", memory: "2Ti"}
---
# TC06 - Pending (node affinity/selector mismatch): no node has this label
# Fix: remove or correct nodeSelector
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc06-nodeselector
  namespace: agent-operator-test
  labels: {testcase: tc06, expected-error: "Pending-NodeSelectorMismatch"}
  annotations:
    autorepair.test/expected-fix: "drop nodeSelector or match an existing node label"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc06}}
  template:
    metadata: {labels: {app: tc06, testcase: tc06}}
    spec:
      nodeSelector:
        disktype: quantum-ssd
        kubernetes.io/arch: sparc64
      containers:
        - name: app
          image: nginx:1.27
---
# TC07 - CreateContainerConfigError: references missing ConfigMap and Secret
# Fix: create the ConfigMap/Secret or mark refs optional
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc07-missing-config
  namespace: agent-operator-test
  labels: {testcase: tc07, expected-error: CreateContainerConfigError}
  annotations:
    autorepair.test/expected-fix: "create configmap tc07-app-config (key LOG_LEVEL) and secret tc07-db-secret (key password)"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc07}}
  template:
    metadata: {labels: {app: tc07, testcase: tc07}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef: {name: tc07-app-config, key: LOG_LEVEL}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: tc07-db-secret, key: password}
---
# TC08 - Pending (unbound PVC): StorageClass does not exist
# Fix: use an existing StorageClass (e.g. local-path on K3s)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tc08-data
  namespace: agent-operator-test
  labels: {testcase: tc08}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: does-not-exist-sc
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc08-unbound-pvc
  namespace: agent-operator-test
  labels: {testcase: tc08, expected-error: "Pending-UnboundPVC"}
  annotations:
    autorepair.test/expected-fix: "recreate PVC tc08-data with a valid storageClassName"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc08}}
  template:
    metadata: {labels: {app: tc08, testcase: tc08}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sleep", "3600"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: tc08-data}
---
# TC09 - Liveness probe failure: wrong port/path -> container killed and restarted repeatedly
# Fix: probe path "/" on port 80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc09-liveness-fail
  namespace: agent-operator-test
  labels: {testcase: tc09, expected-error: "LivenessProbeFailed-CrashLoopBackOff"}
  annotations:
    autorepair.test/expected-fix: "set livenessProbe.httpGet to path / port 80"
spec:
  replicas: 1
  selector: {matchLabels: {app: tc09}}
  template:
    metadata: {labels: {app: tc09, testcase: tc09}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          livenessProbe:
            httpGet: {path: /healthz, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2
---
# TC10 - Readiness probe failure: pod Running but never Ready, Service has no endpoints
# Fix: correct readiness probe
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tc10-readiness-fail
  namespace: agent-operator-test
  labels: {testcase: tc10, expected-error: "NotReady-NoEndpoints"}
  annotations:
    autorepair.test/expected-fix: "set readinessProbe to an existing file/endpoint (e.g. httpGet / on 80)"
spec:
  replicas: 2
  selector: {matchLabels: {app: tc10}}
  template:
    metadata: {labels: {app: tc10, testcase: tc10}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
          readinessProbe:
            exec:
              command: ["cat", "/tmp/ready"]
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tc10-svc
  namespace: agent-operator-test
  labels: {testcase: tc10}
spec:
  selector: {app: tc10}
  ports:
    - {port: 80, targetPort: 80}